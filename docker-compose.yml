services:
  web:
    build: .
    ports:
      - "4500:80"
    environment:
      - EPRINTS_REPO_ID=repositori_stimi
      - EPRINTS_HOSTNAME=localhost
      - DB_HOST=db
      - MYSQL_ROOT_PASSWORD=eprints_root_password
    volumes:
      - ./archives:/opt/eprints3/archives
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mariadb:10.6
    environment:
      - MYSQL_ROOT_PASSWORD=eprints_root_password
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data:
